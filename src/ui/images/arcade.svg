<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- control panel -->
  <rect x="10" y="40" width="300" height="140" rx="18" fill="#2b2d31" stroke="#4a4d52" stroke-width="2"/>
  <rect x="12" y="42" width="296" height="14" rx="12" fill="#34373c"/>
  <!-- joystick -->
  <circle cx="80" cy="124" r="32" fill="#1d1e21" stroke="#55585e" stroke-width="2"/>
  <circle cx="80" cy="124" r="10" fill="#111214"/>
  <line x1="80" y1="124" x2="80" y2="88" stroke="#a5a8ad" stroke-width="7" stroke-linecap="round"/>
  <circle cx="80" cy="78" r="19" fill="#d23b3b" stroke="#9e2a2a" stroke-width="2"/>
  <ellipse cx="73" cy="71" rx="6" ry="4" fill="#f08a8a"/>
  <!-- buttons -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="165" cy="130" r="18" fill="#1f5fa3"/><circle cx="165" cy="127" r="15" fill="#2a82da"/><text x="165" y="132">1</text>
    <circle cx="212" cy="120" r="18" fill="#1f5fa3"/><circle cx="212" cy="117" r="15" fill="#2a82da"/><text x="212" y="122">2</text>
    <circle cx="259" cy="120" r="18" fill="#1f5fa3"/><circle cx="259" cy="117" r="15" fill="#2a82da"/><text x="259" y="122">3</text>
  </g>
  <!-- start -->
  <rect x="226" y="66" width="50" height="18" rx="9" fill="#b07a25"/>
  <rect x="226" y="64" width="50" height="18" rx="9" fill="#e0a040"/>
  <text x="251" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#2b2d31">START</text>
</svg>
